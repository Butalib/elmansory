<app-inner-action-header [showSearch]="true" [showActionButton]="true" [actionLabel]="'إضافة إعلان جديد'"
  [showDate]="true" [dateLabel]="'28 أبريل - 5 مايو'" (search)="onSearch($event)" (actionClicked)="openModalForAdd()">
</app-inner-action-header>

<div class="sliders-grid">
  <!-- الكود الخاص بالـ Loop وعرض الكروت كما هو عندك بالضبط -->
  @for (slider of engine.data$ | async; track slider.id) {
  <app-slide-cards [slider]="slider" (edit)="onEdit(slider)" (delete)="onDelete(slider)"
    (toggle)="onToggle(slider, $event)">
  </app-slide-cards>
  } @empty {
  <div class="no-data">
    <span>لا يوجد إعلانات متطابقة مع البحث</span>
  </div>
  }
</div>

<!-- حقن المودل في نهاية الصفحة وربطه بالـ Signals -->
<!-- نستخدم () لاستخراج القيمة من الـ Signal -->
<app-slide-model [isOpen]="isModalOpen()" [mode]="modalMode()" [sliderData]="selectedSlider()" (close)="closeModal()"
  (save)="onSaveSlider($event)">
</app-slide-model>
