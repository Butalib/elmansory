<app-inner-action-header [showSearch]="true" [btnIcon]="'assets/icon/main-header/add.svg'" [showDate]="true"
    (search)="onSearch($event)" [showFilterButton]="true">
</app-inner-action-header>

<app-generic-table [columns]="tableColumns" [data]="engine.result$ | async" (toggleChange)="onToggleChange($event)"
    [totalPages]="(engine.pagination$ | async)?.totalPages || 1"
    [currentPage]="(engine.pagination$ | async)?.currentPage || 1" (pageChange)="onPageChange($event)">
</app-generic-table>
