@if (isOpen) {
<div class="modal-backdrop" (click)="onBackdropClick($event)">

    <!-- ربط كلاس الحجم برمجياً هنا -->
    <div class="modal-container" [class]="size" dir="rtl">

        <!-- الهيدر -->
        <div class="modal-header">
            <h2 class="modal-title">{{ title }}</h2>
            <button class="close-btn" (click)="closeModal.emit()">
                <img draggable="false" src="assets/icon/slyders/cancel-01.svg" alt="Close">
            </button>
        </div>

        <!-- المحتوى المتغير -->
        <div class="modal-body">
            <ng-content></ng-content>
        </div>

        <!-- الفوتر والأزرار -->
        <div class="modal-footer modal-actions">
            <button type="button" class="btn btn-secondary" (click)="closeModal.emit()">
                {{ cancelLabel }}
            </button>
            <button type="button" class="btn btn-primary" [disabled]="isConfirmDisabled" (click)="confirm.emit()"
                [ngClass]="confirmTheme === 'error' ? 'btn-error' : 'btn-primary'">
                {{ confirmLabel }}
            </button>
        </div>

    </div>
</div>
}
