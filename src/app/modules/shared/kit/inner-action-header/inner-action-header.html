<div class="inner-action-header">
  @if (showSearch) {
  <div class="search-box">
    <img draggable="false" src="assets/icon/main-header/Frame.svg" alt="Search Icon" class="search-icon">
    <input type="text" [placeholder]="searchPlaceholder" #searchInput [formControl]="searchControl">
    @if (hasSearchValue) {
    <button type="button" class="clear-search-btn" aria-label="مسح البحث" title="مسح البحث"
      (click)="clearSearch($event)">
      &times;
    </button>
    }
  </div>
  }

  <div class="header-actions">


    @if (showFilterButton) {
    <div class="relative-container">
      <button type="button" class="date-box" (click)="toggleFilterMenu($event)">
        <img draggable="false" src="assets/icon/main-header/filter-horizontal.svg" alt="Filters Icon" class="date-icon">
        <span>تصفية</span>
      </button>


      @if (isFilterMenuOpen) {
      <div class="dropdown-menu" (click)="$event.stopPropagation()">
        <button type="button" class="dropdown-item" [class.active]="activeSortDirection === 'desc'"
          [attr.aria-pressed]="activeSortDirection === 'desc'" (click)="applySort('desc')">الأحدث أولاً</button>
        <button type="button" class="dropdown-item" [class.active]="activeSortDirection === 'asc'"
          [attr.aria-pressed]="activeSortDirection === 'asc'" (click)="applySort('asc')">الأقدم أولاً</button>
      </div>
      }
    </div>
    }


    @if (showDate) {
    <div class="relative-container date-container" [class.date-container--edge-safe]="!showActionButton">
      <button type="button" class="date-box" (click)="toggleDateMenu($event)">
        <img draggable="false" src="assets/icon/main-header/calendar-02.svg" alt="Date Icon" class="date-icon">
        <span>{{ dateLabel }}</span>
      </button>


      @if (isDateMenuOpen) {
      <div class="dropdown-menu date-picker-menu" (click)="$event.stopPropagation()">
        <div class="date-inputs">
          <div class="input-group">
            <label>من:</label>
            <input type="date" [formControl]="startDateControl">
          </div>
          <div class="input-group">
            <label>إلى:</label>
            <input type="date" [formControl]="endDateControl">
          </div>
        </div>


        @if (startDateControl.value && endDateControl.value && !isDateRangeValid) {
        <span class="error-msg">تاريخ البداية يجب أن يكون قبل تاريخ النهاية!</span>
        }


        <div class="date-actions">
          <button type="button" class="reset-btn" (click)="resetDateRange()">أعادة </button>
          <button type="button" class="apply-btn" [disabled]="!isDateRangeValid"
            (click)="applyDateRange()">
            تطبيق
          </button>
        </div>
      </div>
      }
    </div>
    }


    @if (showActionButton) {
    <button type="button" class="action-btn" (click)="onActionClicked()">
      <img draggable="false" src="{{ btnIcon }}" class="action-icon">
      <span>{{ actionLabel }}</span>
    </button>
    }
  </div>
</div>
