<app-inner-action-header [showSearch]="true" [showActionButton]="true" [actionLabel]="'إضافة حجز جديد'"
  [btnIcon]="'assets/icon/main-header/add.svg'" [showDate]="true" [dateLabel]="'28 أبريل - 5 مايو'"
  (search)="onSearch($event)" (actionClicked)="openModalForAdd()" (filterClicked)="openFilterModal()"
  [showFilterButton]="true">

</app-inner-action-header>


<app-generic-table [columns]="tableColumns" [data]="engine.data$ | async"
  [totalPages]="(engine.totalPages$ | async) || 1" (pageChange)="onPageChange($event)" [currentPage]="currentPage">
  <!-- افترضت إن الـ table بيعمل emit لـ pageChange -->
</app-generic-table>
