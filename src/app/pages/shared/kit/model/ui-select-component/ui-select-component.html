<div class="custom-select-wrapper">


    <div class="select-control">

        <div #triggerElement #selectOrigin="cdkOverlayOrigin" cdkOverlayOrigin class="select-box" [class.open]="isOpen"
            [class.has-error]="control.invalid && control.touched" (click)="toggleDropdown($event)">
            @if (icon) {
            <img draggable="false" src="{{ icon }}" alt="Dropdown Icon" class="prefix-icon">
            }
            <span class="selected-text">
                {{ selectedText || placeholder }}
            </span>

            <img draggable="false" src="assets/icon/sidebar/Vector.svg" alt="Dropdown Icon" class="dropdown-icon"
                [class.rotated]="isOpen">
        </div>

        <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="selectOrigin"
            [cdkConnectedOverlayOpen]="isOpen" [cdkConnectedOverlayPositions]="dropdownPositions"
            [cdkConnectedOverlayWidth]="triggerWidth" [cdkConnectedOverlayHasBackdrop]="true"
            cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop" (backdropClick)="closeDropdown()"
            (detach)="closeDropdown()">
        <ul class="options-list" (click)="$event.stopPropagation()">

            @for (option of options; track option.id) {
            <li class="option-item" [class.selected]="option.id === control.value" (click)="selectOption(option)">
                {{ option.option }}
            </li>
            }

            @empty {
            <li class="option-item empty">
                لا توجد خيارات متوفرة
            </li>
            }

        </ul>
        </ng-template>

    </div>

    @if (control.invalid && control.touched) {
    <small class="error-text">
        هذا الحقل مطلوب
    </small>
    }

</div>
