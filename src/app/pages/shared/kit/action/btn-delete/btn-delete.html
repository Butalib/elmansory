<button type="button" class="btn-delete" (click)="onDelete()">
  <img draggable="false" class="sidebar-icon" src="assets/icon/shared/delete-02.svg" alt="delete" />

  (confirm)="onConfirmDelete()">
</app-confirmation-dialog>
