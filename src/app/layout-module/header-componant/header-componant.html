<header class="main-header">


  <div class="page-title">
    <h1>{{ layoutServices.pageTitle() }}</h1>
  </div>


  <div class="header-actions">


      <button type="button" class="action-btn">
          <img src="assets/icon/sidebar/notifications.svg" alt="إشعارات" class="action-icon">


          @if (notificationsCount() > 0) {
              <span class="notification-badge">

                  {{ notificationsCount() > 99 ? '+99' : notificationsCount() }}
                </span>
            }
        </button>


            <div class="divider"></div>


    <div class="user-profile">
        <img [src]="userData().avatar" alt="صورة المستخدم" class="user-avatar">
      <div class="user-info">
        <span class="user-name">{{ userData().name }}</span>
        <span class="user-handle">{{ userData().handle }}</span>
        <span class="user-role">{{ userData().role }}</span>
    </div>
    </div>


  </div>
</header>
