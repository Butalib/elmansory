<main class="login-page" dir="rtl">

  <div class="background-wrapper">

    <div class="background-pattern"></div>

  </div>

  <section class="login-card" aria-labelledby="login-title">
    <div class="login-header">
      <img src="/assets/img/login/logo.svg" alt="قمة المنصور" class="logo" />
      <h1 id="login-title">مرحباً بعودتك <span aria-hidden="true">👋</span></h1>
      <p>يرجى تسجيل الدخول للوصول إلى لوحة التحكم.</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="input-group">
        <span class="material-icons" aria-hidden="true">person_outline</span>
        <input type="text" placeholder="أدخل اسمك الكامل" formControlName="email" />
      </label>

      <label class="input-group">
        <span class="material-icons" aria-hidden="true">lock_outline</span>
        <input type="password" placeholder="أدخل كلمة السر" formControlName="password" />
        <span class="material-icons password-icon" aria-hidden="true">visibility_off</span>
      </label>

      <button type="submit">تسجيل الدخول</button>
    </form>
  </section>
</main>
